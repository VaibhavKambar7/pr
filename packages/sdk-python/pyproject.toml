[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-sdk"
version = "0.1.0"
description = "Python SDK for consuming Pr prompts from application code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pr_sdk"]
